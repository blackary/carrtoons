name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html styles.css .nojekyll _site/
          cp -R assets _site/assets
          cp -R v1 _site/v1
          cp -R v2 _site/v2
          cp -R v3 _site/v3
          cp -R v4 _site/v4
          cp -R v5 _site/v5
          cp -R v6 _site/v6
          cp -R final-preview _site/final-preview
          cp "1 Preface .pdf" _site/
          cp "1 The Word of God  WPDF.pdf" _site/
          cp "2 Context.pdf" _site/
          cp "4 the meaning of words  copy2.pdf" _site/
          cp "5 Genre Revised copy.pdf" _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
